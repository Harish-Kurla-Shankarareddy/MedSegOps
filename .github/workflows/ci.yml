name: MedSegOps CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:

  test:
    name: Run Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure Git LFS is available
        run: |
          git lfs version
          git lfs install

      - name: Fetch Git LFS objects
        run: |
          git lfs pull

      - name: Verify model artifact
        run: |
          test -f models/monai/model.pt

          echo "Model file:"
          ls -lh models/monai/model.pt

          echo "Model size:"
          stat -c%s models/monai/model.pt

          SIZE=$(stat -c%s models/monai/model.pt)

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: model.pt is not the actual model binary."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q


  docker:
    name: Build and Smoke Test Docker

    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure Git LFS is available
        run: |
          git lfs version
          git lfs install

      - name: Fetch Git LFS objects
        run: |
          git lfs pull

      - name: Verify model artifact
        run: |
          test -f models/monai/model.pt

          echo "Model file:"
          ls -lh models/monai/model.pt

          SIZE=$(stat -c%s models/monai/model.pt)

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: model.pt is not the actual model binary."
            exit 1
          fi

      - name: Build MedSegOps Docker image
        run: |
          docker build \
            -t medsegops:${{ github.sha }} \
            .

      - name: Start MedSegOps container
        run: |
          docker run \
            -d \
            --name medsegops \
            -p 8000:8000 \
            medsegops:${{ github.sha }}

      - name: Wait for API
        run: |
          for i in {1..30}; do

            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8000/health; then

              echo
              echo "MedSegOps API is healthy."
              exit 0

            fi

            echo "Waiting for MedSegOps API..."
            sleep 5

          done

          echo "ERROR: MedSegOps API did not become healthy."
          docker logs medsegops
          exit 1

      - name: Stop container
        if: always()
        run: |
          docker stop medsegops || true
          docker rm medsegops || true